<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/favicon.png" sizes="32x32" />
    <title>myo clinic</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/mn-style.css">
</head>

<body>

    <header class="custom-header">
        <div class="header-wrapper">
            <div class="profile-tab">
                <a href="profile.html"><img src="assets/images/profile-avtar.png" alt="profile-avtar"></a>
            </div>
            <div class="nav-menu">
                <ul>
                    <li>
                        <a href="index.html">
                            <img src="assets/images/discover.svg" alt="icon">
                            <img src="assets/images/discover-h.svg" alt="icon">
                            Discover
                        </a>
                    </li>
                    <li>
                        <a href="user-module.html">
                            <img src="assets/images/module.svg" alt="icon">
                            <img src="assets/images/module-h.svg" alt="icon">
                            Modules
                        </a>
                    </li>
                    <li>
                        <a href="community.html">
                            <img src="assets/images/community.svg" alt="icon">
                            <img src="assets/images/community-h.svg" alt="icon">
                            Community
                        </a>
                    </li>
                    <li>
                        <a href="tracking.html">
                            <img src="assets/images/tracking.svg" alt="icon">
                            <img src="assets/images/tracking-h.svg" alt="icon">
                            Tracking
                        </a>
                    </li>
                    <li class="active">
                        <a href="login.html">
                            <img src="assets/images/login.svg" alt="icon">
                            <img src="assets/images/login-h.svg" alt="icon">
                            Login
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="main-page">
        <div class="myo-container">
            <section class="login-section">
                <div class="login-box">
                    <h1 class="fs-33">Complete Your Profile</h1>
                    <form action="">
                        <div class="avatar-group">
                            <label class="input-label">Upload/select avatar*</label>
                            <div class="avatar-options">
                                <label class="avatar-upload-label">
                                    <input type="file" accept="image/*">
                                    <div class="avatar-circle">
                                        <svg class="camera-icon-svg" viewBox="0 0 24 24">
                                            <path d="M4,4H7L9,2H15L17,4H20A2,2 0 0,1 22,6V18A2,2 0 0,1 20,20H4A2,2 0 0,1 2,18V6A2,2 0 0,1 4,4M12,7A5,5 0 0,0 7,12A5,5 0 0,0 12,17A5,5 0 0,0 17,12A5,5 0 0,0 12,7M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9Z" />
                                        </svg>
                                    </div>
                                </label>

                                <label class="avatar-option">
                                    <input type="radio" name="avatar" value="robot1" checked>
                                    <div class="avatar-circle">
                                        <img src="assets/images/profile-avtar.png" alt="avatar">
                                    </div>
                                </label>

                                <label class="avatar-option">
                                    <input type="radio" name="avatar" value="robot2">
                                    <div class="avatar-circle">
                                        <img src="assets/images/profile-avtar.png" alt="avatar">
                                    </div>
                                </label>

                                <label class="avatar-option">
                                    <input type="radio" name="avatar" value="robot3">
                                    <div class="avatar-circle">
                                        <img src="assets/images/profile-avtar.png" alt="avatar">
                                    </div>
                                </label>

                                <label class="avatar-option">
                                    <input type="radio" name="avatar" value="robot4">
                                    <div class="avatar-circle">
                                        <img src="assets/images/profile-avtar.png" alt="avatar">
                                    </div>
                                </label>

                            </div>
                        </div>
                        <div class="input-group">
                            <label for="display_name">Display name (optional)</label>
                            <input id="display_name" type="text" placeholder="Add your display name here">
                        </div>
                        <div class="input-group">
                            <label for="firstname">First name*</label>
                            <input id="firstname" type="text" placeholder="Add your first name here">
                        </div>
                        <div class="input-group">
                            <label for="lastname">Last name*</label>
                            <input id="lastname" type="text" placeholder="Add your last name here">
                        </div>
                        <div class="form-submit">
                            <button class="universal-btn">SAVE</button>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!-- PDF.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/custom.js"></script>
</body>

</html>
