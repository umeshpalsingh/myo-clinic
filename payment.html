<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/favicon.png" sizes="32x32" />
    <title>myo clinic</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Link Swiper's CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/mn-style.css">
</head>

<body>

    <header class="custom-header">
        <div class="header-wrapper">
            <div class="profile-tab">
                <a href="profile.html"><img src="assets/images/profile-avtar.png" alt="profile-avtar"></a>
            </div>
            <div class="nav-menu">
                <ul>
                    <li>
                        <a href="index.html">
                            <img src="assets/images/discover.svg" alt="icon">
                            <img src="assets/images/discover-h.svg" alt="icon">
                            Discover
                        </a>
                    </li>
                    <li>
                        <a href="user-module.html">
                            <img src="assets/images/module.svg" alt="icon">
                            <img src="assets/images/module-h.svg" alt="icon">
                            Modules
                        </a>
                    </li>
                    <li>
                        <a href="community.html">
                            <img src="assets/images/community.svg" alt="icon">
                            <img src="assets/images/community-h.svg" alt="icon">
                            Community
                        </a>
                    </li>
                    <li>
                        <a href="tracking.html">
                            <img src="assets/images/tracking.svg" alt="icon">
                            <img src="assets/images/tracking-h.svg" alt="icon">
                            Tracking
                        </a>
                    </li>
                    <li>
                        <a href="login.html">
                            <img src="assets/images/login.svg" alt="icon">
                            <img src="assets/images/login-h.svg" alt="icon">
                            Login
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="main-page">
        <div class="myo-container">
            <section class="payment-section">
                <h1 class="fs-40">Payment</h1>
                <div class="ourp-x left">
                    <a href="index.html" class="normal-back"><i class="fa-solid fa-angle-left"></i> Back</a>
                </div>
                <div class="pay-grid">
                    <div class="pay-card">
                        <div class="paycard-flex">
                            <h2 class="fs-30">Pay with Card</h2>
                            <div class="cards-img"><img src="assets/images/cards.png" alt="card"></div>
                        </div>
                        <form class="payment-form">
                            <div class="form-group name-field">
                                <label for="name">Name on Card</label>
                                <input type="text" id="name" value="Kan Williamson">
                            </div>
                            <div class="form-group">
                                <label for="card-number">Card Number</label>
                                <input type="text" id="card-number" value="1234 1234 1234 1234">
                            </div>
                            <div class="flex-container">
                                <div class="form-group">
                                    <label for="expiry">Expiration Date</label>
                                    <input type="text" id="expiry" placeholder="MM/YY">
                                </div>
                                <div class="form-group security-code-field">
                                    <label for="cvc">Security Code</label>
                                    <input type="text" id="cvc" placeholder="CVC">
                                    <span class="cvc-icon"><img src="assets/images/cvv-icon.svg" alt="cvv"></span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="country">Country</label>
                                <select id="country">
                                    <option value="india">India</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="plan-details">
                        <div class="plan-detail-header">
                            <h4 class="fs-30">Plan Details</h4>
                        </div>
                        <div class="plan-detail-main">
                            <div class="plan-flxx">
                                <div class="plan-name">SelfCare Test/Treatments</div>
                                <div class="detail-price">CA24.99</div>
                            </div>
                        </div>
                        <div class="plan-detail-subtotal">
                            <div class="plan-flxx">
                                <div class="plan-total">Subtotal</div>
                                <div class="plan-total-cost">CA24.99</div>
                            </div>
                        </div>
                        <div class="plan-detail-footer">
                            <button class="universal-btn">PAY NOW</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- jQuery CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!-- PDF.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/custom.js"></script>
</body>

</html>
