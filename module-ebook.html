    <script>
        const url = 'assets/images/myo-ebook.pdf';
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const loadingScreen = document.getElementById('loadingScreen');
        const pdfViewer = document.getElementById('pdfViewer');

        pdfjsLib.getDocument(url).promise.then(async (pdf) => {
            const totalPages = pdf.numPages;
            let pagesRendered = 0;

            // Loop through pages
            for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.5 }); // Adjusted scale for better quality

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                pdfViewer.appendChild(canvas);

                // Wait for the page to finish rendering
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                pagesRendered++;

                // Once all pages are done, swap the views
                if (pagesRendered === totalPages) {
                    loadingScreen.style.display = 'none';
                    pdfViewer.style.display = 'block';
                }
            }
        }).catch(err => {
            loadingScreen.innerHTML = "Error loading PDF.";
            console.error(err);
        });
    </script>

    <!-- JS Script to Handle Progress Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBars = document.querySelectorAll('.progress-wrapper');

            progressBars.forEach(bar => {
                // Get values from data attributes (populated by PHP)
                const current = parseInt(bar.getAttribute('data-current') || 0);
                const total = parseInt(bar.getAttribute('data-total') || 1);

                // Update text
                const textEl = bar.querySelector('.progress-text');
                if (textEl) {
                    textEl.textContent = `${current}/${total}`;
                }

                // Calculate Progress Circle
                const circle = bar.querySelector('.progress-circle-fill');
                if (circle) {
                    const radius = circle.r.baseVal.value;
                    const circumference = 2 * Math.PI * radius;

                    // Set SVG properties
                    circle.style.strokeDasharray = `${circumference} ${circumference}`;

                    // Calculate offset
                    // If current is 0, offset = circumference (empty)
                    // If current is total, offset = 0 (full)
                    const percent = Math.min(Math.max(current / total, 0), 1); // Clamp between 0 and 1
                    const offset = circumference - (percent * circumference);

                    circle.style.strokeDashoffset = offset;
                }
            });
        });
    </script>
